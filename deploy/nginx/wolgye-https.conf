# Use only AFTER Certbot has issued wolgye.kr's certificate.
server {
    listen 80;
    listen [::]:80;
    server_name wolgye.kr;
    return 301 https://wolgye.kr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wolgye.kr;
    ssl_certificate /etc/letsencrypt/live/wolgye.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wolgye.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
